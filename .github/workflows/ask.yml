name: 오늘의 질문 보내기

on:
  schedule:
    # 정시 실행은 외부 cron(cron-job.org)이 KST 09:50에 workflow_dispatch로 담당.
    # GitHub cron은 몇 시간씩 늦거나 누락될 수 있어서 백업으로만 둠 (이미 올렸으면 ask.ts가 건너뜀)
    # UTC 기준: 00:50 = KST 09:50, 02:00 = KST 11:00
    - cron: '50 0 * * 1-5'
    - cron: '0 2 * * 1-5'
  workflow_dispatch: # 외부 cron 호출 + Actions 탭에서 수동 실행

jobs:
  ask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ask
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
